<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 15px;
    }
    .card {
      background: #202d42;
      padding: 30px 20px;
      border-radius: 18px;
      max-width: 400px;
      margin: auto;
    }
    h1 { color: #62e6a7; }
    button {
      background: #62e6a7;
      color: #101827;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, world! 👋</h1>
    <p>Welcome to my first website.</p>
    <p>I'm learning to code on GitHub!</p>
    <button onclick="showMessage()">My first button</button>

<p id="message"></p>

<script>
  function showMessage() {
    document.getElementById("message").textContent =
      "🔥 You just made your first interactive website!";
  }
</script>
  </div>
</body>
</html>
